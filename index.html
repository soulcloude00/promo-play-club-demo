'use strict';const PROMO=`<svg viewBox="0 0 60 72" aria-label="Promo the torch-flame mascot"><path d="M30 2C40 14 46 22 40 34C38 28 35 27 34 31C33 24 27 22 26 16C22 22 18 27 20 34C13 26 18 14 30 2Z" fill="#f26b21"/><path d="M30 14C35 21 37 27 33 34C31 31 29 31 27 34C24 28 26 21 30 14Z" fill="#ffc93c"/><rect x="12" y="30" width="36" height="38" rx="12" fill="#1a2a4f"/><circle cx="23" cy="45" r="6" fill="#fff"/><circle cx="37" cy="45" r="6" fill="#fff"/><circle cx="24" cy="46" r="3" fill="#1a2a4f"/><circle cx="38" cy="46" r="3" fill="#1a2a4f"/><path d="M23 56Q30 62 37 56" stroke="#f26b21" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="17" cy="53" r="2.5" fill="#f26b21" opacity=".5"/><circle cx="43" cy="53" r="2.5" fill="#f26b21" opacity=".5"/></svg>`,KEY='promo-play-club-mobile-v1';
let data={sound:true,music:false,games:{},stories:{},mistakes:0};let storage=true;try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){data.sound=d.sound!==false;data.music=d.music===true;for(let k of ['games','stories'])if(d[k]&&typeof d[k]==='object')data[k]=d[k];data.mistakes=Number.isFinite(d.mistakes)?d.mistakes:0;}}catch(e){storage=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){storage=false;toast('Storage unavailable. Progress lasts for this visit only.');}}
let audio=null,musicTimer=null,noteNo=0;function tone(ctx,f=440,d=.12,delay=0,volume=.15){const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02);return o;}
async function unlock(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('not supported');if(!audio){audio=new C();audio.onstatechange=updateSound;}if(audio.state!=='running')await audio.resume();if(audio.state!=='running')throw Error('paused');updateSound();updateMusic();return true;}catch(e){updateSound();toast('Audio unavailable or paused. You can still play with captions.');return false;}}
function sfx(type='tap'){if(!data.sound||!audio||audio.state!=='running')return;const notes=type==='win'?[523,659,784,1046]:type==='wrong'?[220,185]:type==='step'?[587,784]:[440];notes.forEach((f,i)=>tone(audio,f,type==='tap'?.07:.16,i*.11,type==='tap'?.045:.12));}
function updateSound(){const b=document.querySelector('#soundButton');b.textContent=!data.sound?'Sound: off':audio&&audio.state==='running'?'Sound: on':'Sound: tap';if(document.querySelector('#audioStatus'))document.querySelector('#audioStatus').textContent=!data.sound?'Effects are muted.':audio&&audio.state==='running'?'Audio engine running. Use Test sound to check your speaker volume.':'Audio is paused. Tap Enable audio to start it.';}
function updateMusic(){clearInterval(musicTimer);musicTimer=null;if(data.music&&data.sound&&audio&&audio.state==='running'&&!document.hidden)musicTimer=setInterval(()=>{if(audio.state==='running')tone(audio,[261.63,329.63,392,329.63][noteNo++%4],.6,0,.022);},800);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(musicTimer);if(audio&&audio.state==='running')audio.suspend();}else{updateSound();} });
document.addEventListener('pointerdown',()=>{if(data.sound&&(!audio||audio.state!=='running'))unlock();},{passive:true});document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('tap');});
document.querySelector('#soundButton').onclick=async()=>{if(!audio||audio.state!=='running'){data.sound=true;await unlock();sfx('step');}else{data.sound=!data.sound;updateSound();updateMusic();if(data.sound)sfx('step');}persist();};
document.querySelector('#enableSound').onclick=async()=>{data.sound=true;const ok=await unlock();persist();if(ok){sfx('win');document.querySelector('#soundDialog').close();}else document.querySelector('#unlockMessage').textContent='Audio could not start. Try again, or choose Play quietly.';};document.querySelector('#silentStart').onclick=()=>{data.sound=false;persist();updateSound();document.querySelector('#soundDialog').close();};

const main=document.querySelector('#main');let currentPage='home',activity=null,timers=[],selected=-1;
function later(fn,ms){let id=setTimeout(fn,ms);timers.push(id);return id;}function cleanup(){timers.forEach(clearTimeout);timers=[];activity=null;}
const games=[['clues','🔎','Clue Catch','Sort evidence before you share.','AI literacy · 3 rounds'],['lights','💡','Lighthouse Echo','Watch, remember, light the way.','Focus + sequencing · 3 rounds'],['order','🦊','Story Shuffle','Tap two scenes to swap them.','Storytelling · 3 rounds']];

function navigate(page){cleanup();currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.className='page';if(page==='home')main.innerHTML=`<div class="hero"><div class="promo">${PROMO}</div><div class="eyebrow">Your pocket playground</div><h1>Tap. Try.<br>Try again.</h1><p>Play a quick game or choose what happens in a story.</p><button class="orange" data-game="clues">Let's play ↗</button></div><div class="sectionline"><h2>Little games, big tries</h2><span class="pill">No lost lives</span></div>${gameTiles()}<div class="sectionline"><h2>Step into a story</h2><span class="pill">Your choices</span></div>${storyTiles()}<p class="note">Promo asks questions. You make the next move. Nothing is posted or shared.</p>`;

function renderProgress(){main.innerHTML=`<div class="eyebrow">Your practice trail</div><h1>You made a move.</h1><p class="sub">Actions saved here, not scores or a skill assessment.</p><div class="card"><h2>Games completed</h2>${games.map(g=>`<div class="badge">${data.games[g[0]]?'✓':'○'} ${g[2]} · ${Number(data.games[g[0]])||0} finished runs</div>`).join('')}<h2>Stories explored</h2><div class="badge">${data.stories.moon?'✓':'○'} The Moon Garden · ${Number(data.stories.moon)||0} endings</div><div class="badge">${data.stories.stage?'✓':'○'} The Tiny Big Talk · ${Number(data.stories.stage)||0} endings</div><p class="note">${data.mistakes} mistakes met with another try. No points were taken away.</p></div><div class="card"><h2>Sound desk</h2><p id="audioStatus" class="soundstate"></p><div class="row"><button id="audioEnable" class="primary">Enable audio</button><button id="soundTest">Test sound ♪</button></div><div class="settingrow"><span>Gentle music</span><button id="musicToggle">${data.music?'On':'Off'}</button></div><p class="note">If the engine is running but you hear nothing, check device volume and silent mode. Sound output has not been verified on every phone.</p></div><details class="card"><summary>For a parent or teacher</summary><p class="sub">Ask: “Which choice changed your story?” or “What did you try after a mistake?” All characters and sources in activities are fictional learning examples. No camera, microphone, login, messages or uploads.</p><p class="note">Progress belongs to this browser, not a child profile. Other people on this device can see it. ${storage?'':'Storage is unavailable for this visit.'}</p><button id="reset">Reset this device's club progress</button></details>`;
main.querySelector('#audioEnable').onclick=async()=>{data.sound=true;await unlock();persist();sfx('step');};main.querySelector('#soundTest').onclick=async()=>{data.sound=true;await unlock();persist();sfx('win');updateSound();};main.querySelector('#musicToggle').onclick=async()=>{data.music=!data.music;if(data.music){data.sound=true;await unlock();}persist();updateMusic();main.querySelector('#musicToggle').textContent=data.music?'On':'Off';};main.querySelector('#reset').onclick=()=>{if(confirm('Clear game progress, story endings and retry counts on this browser?')){data.games={};data.stories={};data.mistakes=0;persist();navigate('progress');}};}

function startGame(id){cleanup();activity={id,round:0};shell(games.find(g=>g[0]===id)[2],'Round 1 of 3');if(id==='clues')clueRound();if(id==='lights')lightRound();if(id==='order')orderRound();}
const clueSets=[[["📋","Dated garden log: dry soil",true],["💬","Forward: plants hate water",false],["🔬","Two soil tests: dry",true]],[["🔭","Dated sky chart: no new star",true],["🤖","AI says: a new star! No source",false],["📣","Viral clip: trust me!",false]],[["🌡️","Thermometer reading: 28°C",true],["🧪","Repeated reading: 28°C",true],["💭","A guess: it must be 50°C",false]]];
function clueRound(){selected=-1;activity.done=[];let r=activity.round;document.querySelector('#roundLabel').textContent=`Round ${r+1} of 3 · AI fact-checking`;document.querySelector('#playArea').innerHTML=`<div class="stage"><div class="bubble">Tap a clue. Then tap its home.</div><div class="clues">${clueSets[r].map((c,i)=>`<button class="clue" data-clue="${i}" aria-pressed="false"><span>${c[0]}</span>${c[1]}</button>`).join('')}</div></div>`;document.querySelector('#feedback').textContent='Sort observed evidence from claims that need checking. These are fictional examples.';document.querySelector('#actions').innerHTML='<div class="row trays"><button data-bin="true">📚 Observed evidence</button><button data-bin="false">🔍 Check this claim</button></div>';main.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.clue);main.querySelectorAll('[data-clue]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});main.querySelectorAll('[data-bin]').forEach(b=>b.onclick=()=>{if(selected<0){feedback('Tap one of the floating clues first.');return;}const right=clueSets[r][selected][2];if((b.dataset.bin==='true')!==right){feedback('Try again. Is this an observation with a traceable source, or just a claim?',true);return;}const btn=main.querySelector(`[data-clue="${selected}"]`);btn.disabled=true;btn.classList.add('done');btn.setAttribute('aria-pressed','false');activity.done.push(selected);selected=-1;feedback(right?'Evidence filed. Even a recorded observation can have limits.':'Set aside for checking. Repetition alone is not proof.');if(activity.done.length===3){main.querySelectorAll('[data-bin]').forEach(x=>x.disabled=true);document.querySelector('#actions').innerHTML=`<button class="orange wide" id="nextRound">${r===2?'Finish expedition':'Next round →'}</button>`;document.querySelector('#nextRound').onclick=()=>{if(++activity.round===3)finishGame('clues');else clueRound();};}});}
const patterns=[[0,2],[1,3,0],[2,0,3,1]];let lightBusy=false;
function lightRound(){activity.input=0;lightBusy=false;document.querySelector('#roundLabel').textContent=`Round ${activity.round+1} of 3 · Watch, then tap`;document.querySelector('#playArea').innerHTML=`<div class="stage"><div class="bubble" id="lightPrompt">Tap Watch pattern to begin.</div><div class="lamps">${['☀','☾','★','◆'].map((x,i)=>`<button class="lamp" data-lamp="${i}" aria-label="Lamp ${i+1}" disabled>${x}</button>`).join('')}</div></div>`;document.querySelector('#feedback').textContent='Notice the order. The symbols help you remember without colour.';document.querySelector('#actions').innerHTML='<button id="watch" class="primary wide">Watch pattern ▶</button>';document.querySelector('#watch').onclick=showPattern;main.querySelectorAll('[data-lamp]').forEach(b=>b.onclick=()=>tapLight(Number(b.dataset.lamp)));}
function flash(i){let b=main.querySelector(`[data-lamp="${i}"]`);if(!b)return;b.classList.add('flash');if(data.sound&&audio&&audio.state==='running')tone(audio,[330,440,550,660][i],.25);later(()=>b.classList.remove('flash'),330);}
function showPattern(){if(lightBusy)return;lightBusy=true;activity.input=0;document.querySelector('#watch').disabled=true;main.querySelectorAll('[data-lamp]').forEach(b=>b.disabled=true);document.querySelector('#lightPrompt').textContent='Watch the lights…';const seq=patterns[activity.round];seq.forEach((v,i)=>later(()=>flash(v),250+i*650));later(()=>{lightBusy=false;main.querySelectorAll('[data-lamp]').forEach(b=>b.disabled=false);document.querySelector('#watch').disabled=false;document.querySelector('#watch').textContent='Watch it again ↻';document.querySelector('#lightPrompt').textContent='Your turn. Tap the same order.';},seq.length*650+300);}
function tapLight(i){if(lightBusy)return;flash(i);const seq=patterns[activity.round];if(i!==seq[activity.input]){activity.input=0;feedback('A different order! Start this pattern again, or tap Watch it again.',true);return;}activity.input++;if(activity.input===seq.length){main.querySelectorAll('[data-lamp]').forEach(b=>b.disabled=true);feedback('Pattern repaired. The beam reaches further!');document.querySelector('#lightPrompt').textContent='Light restored!';document.querySelector('#actions').innerHTML=`<button class="orange wide" id="nextRound">${activity.round===2?'Light the lighthouse':'Next pattern →'}</button>`;document.querySelector('#nextRound').onclick=()=>{if(++activity.round===3)finishGame('lights');else lightRound();};}else document.querySelector('#lightPrompt').textContent=`${activity.input} of ${seq.length} lights. Keep going.`;}
const orderSets=[['🦊|Fox wants to grow a sunflower.','🌧️|A storm knocks its pot over.','🌻|Fox replants it with a friend.'],['🤖|Robot wants to tell a story.','😶|It forgets the middle on stage.','📝|It uses scene cards and tries again.'],['🛶|A team wants to cross a stream.','🪵|Their first raft comes apart.','🪢|They test stronger knots together.']];
function orderRound(){activity.order=[2,0,1];selected=-1;renderOrder();}
function renderOrder(){document.querySelector('#roundLabel').textContent=`Round ${activity.round+1} of 3 · Beginning → problem → change`;document.querySelector('#playArea').innerHTML=`<div class="stage"><div class="bubble">Tap any two scenes to swap them.</div><div class="ordercards">${activity.order.map((id,i)=>{let [icon,text]=orderSets[activity.round][id].split('|');return `<button class="ordercard ${selected===i?'selected':''}" data-order="${i}"><b>${i+1}</b><span>${icon}</span>${text}</button>`;}).join('')}</div></div>`;document.querySelector('#feedback').textContent='Build a story that makes sense: what did they want, what went wrong, what changed?';document.querySelector('#actions').innerHTML='<button class="orange wide" id="checkOrder">Try my story ✓</button>';main.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.order);if(selected<0){selected=i;renderOrder();}else{[activity.order[selected],activity.order[i]]=[activity.order[i],activity.order[selected]];selected=-1;renderOrder();sfx('step');}});document.querySelector('#checkOrder').onclick=()=>{if(activity.order.some((x,i)=>x!==i)){feedback('The scenes feel out of order. Which moment starts the problem? Swap and try again.',true);return;}feedback('The story connects. A beginning, a problem and a change.');main.querySelectorAll('[data-order]').forEach(b=>b.disabled=true);document.querySelector('#actions').innerHTML=`<button class="orange wide" id="nextRound">${activity.round===2?'Finish story collection':'Next story →'}</button>`;document.querySelector('#nextRound').onclick=()=>{if(++activity.round===3)finishGame('order');else orderRound();};};}
const stories={moon:{title:'The Moon Garden',kind:'space',art:['🤖 🌱','🤖 🦊','🪴 💧','🤖 🛠️','🌱 ✨'],scenes:[{t:'Milo the robot wants to grow a moon garden. A seedling droops. Fox arrives with one small bottle of water.',next:'Meet Fox →'},{t:'Fox says, “I brought this for my own plant.” Milo wants the water. What happens next?',choices:['Ask if they can plan together','Grab the bottle without asking']},{t:['Milo asks. Fox offers half, and they plan how to reuse water. Both plants get a small drink.','Milo grabs it. Fox steps back, upset. Milo notices the silence and returns the bottle. Trust needs repair.'],next:'See what happens →'},{t:'There is still too little water for tomorrow. How could they move forward?',choices:['Build and test a water collector together','Use the last drops now and wait']},{t:['Their first collector leaks. They patch it together and save a few drops. The garden has a next step.','The water runs out. They decide to test a collector next. Waiting showed them why a plan matters.'],next:'Finish story ✓'}]},stage:{title:'The Tiny Big Talk',kind:'garden',art:['🦊 🎤','🦊 💭','🦊 🌬️','🦊 🐰','🎤 ✨'],scenes:[{t:'Fox has an idea for a quiet story corner. Today is the first chance to tell the club.',next:'Step toward the stage →'},{t:'Fox feels a flutter in the stomach. The first words get tangled. What should Fox try?',choices:['Take a comfortable breath and say one thought','Rush through every word at once']},{t:['Fox breathes and says, “I have an idea.” A short pause gives the audience time to listen.','Fox rushes. Rabbit misses the idea and asks for it again. Fox can slow down and restart.'],next:'Keep going →'},{t:'Rabbit asks, “Why do we need a story corner?” Fox does not know what everyone thinks yet.',choices:['Share one reason, then invite another idea','Pretend everyone already agrees']},{t:['Fox explains, then listens. Rabbit suggests cushions. The idea grows because more voices join in.','Rabbit looks puzzled. Fox says, “I should ask, not assume.” The group gets a new chance to join in.'],next:'Finish story ✓'}]}};
function startStory(id){cleanup();activity={id,scene:0,choices:[]};shell(stories[id].title,'Scene 1 of 5');renderStory();}
function renderStory(){const s=stories[activity.id],n=activity.scene,scene=s.scenes[n];document.querySelector('#roundLabel').textContent=`Scene ${n+1} of 5 · Your choices change the story`;const art=s.art[n].split(' ');document.querySelector('#playArea').innerHTML=`<div class="stage story-stage ${s.kind==='space'?'space':''}"><div class="scene-number">${n===2||n===4?'Your choice, its consequence':'An animated mini-story'}</div><div class="scene-art" aria-hidden="true"><span>${art[0]}</span><span class="prop">${art[1]}</span></div><div class="promo">${PROMO}</div></div><div class="story-caption" id="storyCaption"></div>`;document.querySelector('#storyCaption').textContent=Array.isArray(scene.t)?scene.t[activity.choices[n===2?0:1]]:scene.t;document.querySelector('#feedback').hidden=true;document.querySelector('#actions').innerHTML=scene.choices?scene.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c}</button>`).join(''):`<button class="primary wide" id="storyNext">${scene.next}</button>`;main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{activity.choices.push(Number(b.dataset.choice));activity.scene++;sfx('step');renderStory();});let next=document.querySelector('#storyNext');if(next)next.onclick=()=>{if(++activity.scene===5)finishStory();else{sfx('step');renderStory();}};window.scrollTo(0,0);}
function finishStory(){const id=activity.id;data.stories[id]=(Number(data.stories[id])||0)+1;persist();sfx('win');document.querySelector('#roundLabel').textContent='An ending to think about';document.querySelector('#playArea').innerHTML=`<div class="win"><div class="big">${id==='moon'?'🌱':'🎤'}</div><h2>${id==='moon'?'Small kindness. Another try.':'Your voice has room.'}</h2><p>${id==='moon'?'Who changed their mind? Tell the story in your own words.':'Say one thought aloud, then pause. What do you notice?'}</p><p class="note">No microphone is used. You can practise quietly too.</p></div>`;document.querySelector('#actions').innerHTML='<div class="row"><button id="storyReplay" class="orange">Try other choices ↻</button><button id="storyDone">More stories</button></div>';document.querySelector('#storyReplay').onclick=()=>startStory(id);document.querySelector('#storyDone').onclick=()=>navigate('stories');}
navigate('home');updateSound();document.querySelector('#soundDialog').showModal();
</script></body></html>
