function gameTiles(){return games.map(([id,icon,title,desc,meta])=>`<button class="tile" data-game="${id}"><div class="cover">${sceneArt(id==='lights'?'lights':id==='order'?'order':'clues')}<span class="cover-tag">${meta.split(' · ')[0]} · 3 rounds</span><span class="playorb">▶</span></div><div class="tilecopy"><div><b>${title}</b><small>${desc}</small></div><span class="timepill">${data.games[id]?'✓ PLAY AGAIN':'LET’S PLAY'}</span></div></button>`).join('');}
function storyTiles(){return `<div class="storytiles">${[['moon','The Moon Garden','Kindness · Your choices'],['stage','The Tiny Big Talk','Speaking · Your choices']].map(([id,title,meta])=>`<button class="storytile" data-story="${id}"><div class="storycover">${sceneArt(id,0)}</div><div class="storycopy"><b>${title}</b><small>${meta}</small></div></button>`).join('')}</div>`;}
function navigate(page){document.body.classList.remove('playing');cleanup();currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.className='page';if(page==='home')main.innerHTML=`<div class="daily"><span class="spark">✦</span><span><b>Hello, explorer.</b> What will you try today?</span></div><div class="hero"><div class="heroart">${sceneArt('moon',1)}</div><div class="eyebrow">A pocket full of possibilities</div><h1>Big ideas.<br>Little adventures.</h1><p>Play, make a choice, and discover what happens next.</p><button class="orange" data-game="lights">Light the way ▶</button></div>${trailMini()}<div class="sectionline"><h2>Step into a story</h2><span class="pill">You choose</span></div>${storyTiles()}<div class="sectionline"><h2>Play a little. Learn a little.</h2><span class="pill">3 quick games</span></div>${gameTiles()}<p class="end-note">That's the whole playground. Try something, then take your idea offline.</p>`;
if(page==='games')main.innerHTML=`<div class="eyebrow">Playground</div><h1>Pick your next try.</h1><p class="sub">Big tap targets. No dragging. Mistakes mean another go.</p>${gameTiles()}`;
if(page==='stories')main.innerHTML=`<div class="eyebrow">Animated mini-stories</div><h1>What happens next?</h1><p class="sub">Two little adventures. Tap a choice and see its consequence.</p>${storyTiles()}<div class="card"><b>Read it your way</b><p class="sub">Stories use animated illustrations, captions and generated sound effects. They are not video files. No speech audio is required.</p></div>`;
if(page==='progress')renderProgress();bindCards();window.scrollTo(0,0);updateSound();}
function bindCards(){main.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>startGame(b.dataset.game));main.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>startStory(b.dataset.story));}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function renderProgress(){main.innerHTML=`<div class="eyebrow">Your practice trail</div><h1>You made a move.</h1><p class="sub">Actions saved here, not scores or a skill assessment.</p><div class="card"><h2>Games completed</h2>${games.map(g=>`<div class="badge">${data.games[g[0]]?'✓':'○'} ${g[2]} · ${Number(data.games[g[0]])||0} finished runs</div>`).join('')}<h2>Stories explored</h2><div class="badge">${data.stories.moon?'✓':'○'} The Moon Garden · ${Number(data.stories.moon)||0} endings</div><div class="badge">${data.stories.stage?'✓':'○'} The Tiny Big Talk · ${Number(data.stories.stage)||0} endings</div><p class="note">${data.mistakes} mistakes met with another try. No points were taken away.</p></div><div class="card"><h2>Sound desk</h2><p id="audioStatus" class="soundstate"></p><div class="row"><button id="audioEnable" class="primary">Enable audio</button><button id="soundTest">Test sound ♪</button></div><div class="settingrow"><span>Gentle music</span><button id="musicToggle">${data.music?'On':'Off'}</button></div><p class="note">If the engine is running but you hear nothing, check device volume and silent mode. Sound output has not been verified on every phone.</p></div><details class="card"><summary>For a parent or teacher</summary><p class="sub">Ask: “Which choice changed your story?” or “What did you try after a mistake?” All characters and sources in activities are fictional learning examples. No camera, microphone, login, messages or uploads.</p><p class="note">Progress belongs to this browser, not a child profile. Other people on this device can see it. ${storage?'':'Storage is unavailable for this visit.'}</p><button id="reset">Reset this device's club progress</button></details>`;
main.querySelector('#audioEnable').onclick=async()=>{data.sound=true;await unlock();persist();sfx('step');};main.querySelector('#soundTest').onclick=async()=>{data.sound=true;await unlock();persist();sfx('win');updateSound();};main.querySelector('#musicToggle').onclick=async()=>{data.music=!data.music;if(data.music){data.sound=true;await unlock();}persist();updateMusic();main.querySelector('#musicToggle').textContent=data.music?'On':'Off';};main.querySelector('#reset').onclick=()=>{if(confirm('Clear game progress, story endings and retry counts on this browser?')){data.games={};data.stories={};data.mistakes=0;persist();navigate('progress');}};}
function shell(title,meta){document.body.classList.add('playing');main.className='activity';main.innerHTML=`<div class="activitytop"><button class="back" id="back" aria-label="Leave activity">‹</button><div><h1>${title}</h1><small id="roundLabel">${meta}</small></div></div><div id="playArea"></div><div class="feedback" id="feedback" role="status">Your next move is waiting.</div><div id="actions"></div>`;main.querySelector('#back').onclick=()=>navigate(currentPage);window.scrollTo(0,0);}
function feedback(t,bad=false){document.querySelector('#feedback').textContent=t;sfx(bad?'wrong':'step');if(bad){data.mistakes++;persist();}}
function finishGame(id){const n=activity.round;cleanup();data.games[id]=(Number(data.games[id])||0)+1;persist();sfx('win');document.querySelector('#playArea').innerHTML=`<div class="win"><div class="big">${sceneArt(id==='lights'?'lights':id==='clues'?'clues':'order')}</div><h2>${id==='lights'?'The lighthouse is glowing!':id==='clues'?'The evidence is sorted!':'Your stories have a shape!'}</h2><p>${id==='lights'?'You watched a pattern, then rebuilt it.':id==='clues'?'A confident claim still needs evidence. Check who observed what.':'A beginning sets up a problem. A choice leads to a change.'}</p><p class="note">Three rounds complete. Mistakes never cost you progress.</p></div>`;document.querySelector('#feedback').textContent='What helped you on your next try?';document.querySelector('#actions').innerHTML='<div class="row"><button class="orange" id="replay">Play again ↻</button><button id="done">Back to playground</button></div>';document.querySelector('#replay').onclick=()=>startGame(id);document.querySelector('#done').onclick=()=>navigate('games');}
function startGame(id){cleanup();activity={id,round:0};shell(games.find(g=>g[0]===id)[2],'Round 1 of 3');if(id==='clues')clueRound();if(id==='lights')lightRound();if(id==='order')orderRound();}
const clueSets=[[["📋","Dated garden log: dry soil",true],["💬","Forward: plants hate water",false],["🔬","Two soil tests: dry",true]],[["🔭","Dated sky chart: no new star",true],["🤖","AI says: a new star! No source",false],["📣","Viral clip: trust me!",false]],[["🌡️","Thermometer reading: 28°C",true],["🧪","Repeated reading: 28°C",true],["💭","A guess: it must be 50°C",false]]];
function clueRound(){selected=-1;activity.done=[];let r=activity.round;document.querySelector('#roundLabel').textContent=`Round ${r+1} of 3 · AI fact-checking`;document.querySelector('#playArea').innerHTML=`<div class="stage"><div class="stage-back">${sceneArt('clues')}</div><div class="bubble">Tap a clue. Then tap its home.</div><div class="clues">${clueSets[r].map((c,i)=>`<button class="clue" data-clue="${i}" aria-pressed="false"><span>${iconArt(c[2]?(i===2?'test':'log'):'claim')}</span>${c[1]}</button>`).join('')}</div></div>`;document.querySelector('#feedback').textContent='Sort observed evidence from claims that need checking. These are fictional examples.';document.querySelector('#actions').innerHTML='<div class="row trays"><button data-bin="true">📚 Observed evidence</button><button data-bin="false">🔍 Check this claim</button></div>';main.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.clue);main.querySelectorAll('[data-clue]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});main.querySelectorAll('[data-bin]').forEach(b=>b.onclick=()=>{if(selected<0){feedback('Tap one of the floating clues first.');return;}const right=clueSets[r][selected][2];if((b.dataset.bin==='true')!==right){feedback('Try again. Is this an observation with a traceable source, or just a claim?',true);return;}const btn=main.querySelector(`[data-clue="${selected}"]`);btn.disabled=true;btn.classList.add('done');btn.setAttribute('aria-pressed','false');activity.done.push(selected);selected=-1;feedback(right?'Evidence filed. Even a recorded observation can have limits.':'Set aside for checking. Repetition alone is not proof.');if(activity.done.length===3){main.querySelectorAll('[data-bin]').forEach(x=>x.disabled=true);document.querySelector('#actions').innerHTML=`<button class="orange wide" id="nextRound">${r===2?'Finish expedition':'Next round →'}</button>`;document.querySelector('#nextRound').onclick=()=>{if(++activity.round===3)finishGame('clues');else clueRound();};}});}
const patterns=[[0,2],[1,3,0],[2,0,3,1]];let lightBusy=false;
function lightRound(){activity.input=0;lightBusy=false;document.querySelector('#roundLabel').textContent=`Round ${activity.round+1} of 3 · Watch, then tap`;document.querySelector('#playArea').innerHTML=`<div class="stage" id="lightStage"><div class="stage-back">${sceneArt('lights')}</div><div class="bubble" id="lightPrompt">Tap Watch pattern to begin.</div><div class="phase" id="lightPhase">WATCH → REMEMBER → REPEAT</div><div class="lamps">${['☀','☾','★','◆'].map((x,i)=>`<button class="lamp" data-lamp="${i}" aria-label="Lamp ${i+1}" disabled>${x}</button>`).join('')}</div></div>`;document.querySelector('#feedback').textContent='Notice the order. The symbols help you remember without colour.';document.querySelector('#actions').innerHTML='<button id="watch" class="primary wide">Watch pattern ▶</button>';document.querySelector('#watch').onclick=showPattern;main.querySelectorAll('[data-lamp]').forEach(b=>b.onclick=()=>tapLight(Number(b.dataset.lamp)));}
function flash(i){let b=main.querySelector(`[data-lamp="${i}"]`);if(!b)return;b.classList.add('flash');if(data.sound&&audio&&audio.state==='running')tone(audio,[330,440,550,660][i],.25);later(()=>b.classList.remove('flash'),330);}
function showPattern(){if(lightBusy)return;lightBusy=true;activity.input=0;document.querySelector('#watch').disabled=true;main.querySelectorAll('[data-lamp]').forEach(b=>b.disabled=true);document.querySelector('#lightPrompt').textContent='Watch the lights…';document.querySelector('#lightStage').classList.add('watching');document.querySelector('#lightPhase').textContent='WATCHING THE PATTERN';const seq=patterns[activity.round];seq.forEach((v,i)=>later(()=>flash(v),250+i*650));later(()=>{lightBusy=false;document.querySelector('#lightStage').classList.remove('watching');document.querySelector('#lightPhase').textContent='YOUR TURN TO REPEAT';main.querySelectorAll('[data-lamp]').forEach(b=>b.disabled=false);document.querySelector('#watch').disabled=false;document.querySelector('#watch').textContent='Watch it again ↻';document.querySelector('#lightPrompt').textContent='Your turn. Tap the same order.';},seq.length*650+300);}
function tapLight(i){if(lightBusy)return;flash(i);const seq=patterns[activity.round];if(i!==seq[activity.input]){activity.input=0;feedback('A different order! Start this pattern again, or tap Watch it again.',true);return;}activity.input++;if(activity.input===seq.length){main.querySelectorAll('[data-lamp]').forEach(b=>b.disabled=true);feedback('Pattern repaired. The beam reaches further!');document.querySelector('#lightPrompt').textContent='Light restored!';document.querySelector('#lightPhase').textContent='PATTERN COMPLETE';document.querySelector('#actions').innerHTML=`<button class="orange wide" id="nextRound">${activity.round===2?'Light the lighthouse':'Next pattern →'}</button>`;document.querySelector('#nextRound').onclick=()=>{if(++activity.round===3)finishGame('lights');else lightRound();};}else document.querySelector('#lightPrompt').textContent=`${activity.input} of ${seq.length} lights. Keep going.`;}
const orderSets=[['🦊|Mira wants to grow a sunflower.','🌧️|A storm knocks its pot over.','🌻|Mira replants it with a friend.'],['🤖|Robot wants to tell a story.','😶|It forgets the middle on stage.','📝|It uses scene cards and tries again.'],['🛶|A team wants to cross a stream.','🪵|Their first raft comes apart.','🪢|They test stronger knots together.']];
function orderRound(){activity.order=[2,0,1];selected=-1;renderOrder();}

let drag=null,lastTouchChoice=-1000;
function stopDrag(){if(drag){drag.ghost.remove();drag=null;}document.body.style.userSelect='';main.querySelectorAll('.orderitem').forEach(e=>{e.style.transform='';e.classList.remove('drag-source','drop-before','drop-after');});}
function renderOrder(announce=true){stopDrag();document.querySelector('#roundLabel').textContent=`Round ${activity.round+1} of 3 · Beginning → problem → change`;document.querySelector('#playArea').innerHTML=`<div class="stage"><div class="stage-back">${sceneArt('order')}</div><div class="bubble">Drag the grips. Or tap two scenes to swap.</div><div class="ordercards" aria-label="Story scenes to reorder">${activity.order.map((id,i)=>{let [icon,text]=orderSets[activity.round][id].split('|');return `<div class="orderitem ${selected===i?'selected':''}" data-item="${i}"><button class="grab" data-grab="${i}" aria-label="Drag scene ${i+1}" title="Drag to reorder">⠿</button><button class="ordercard" data-order="${i}" aria-pressed="${selected===i}"><span class="miniart">${shuffleMini(activity.round,id)}</span><span class="scene-text"><b>${i+1}.</b> ${text}</span></button><span class="move-controls"><button data-move="${i},-1" aria-label="Move scene ${i+1} up" ${i===0?'disabled':''}>↑</button><button data-move="${i},1" aria-label="Move scene ${i+1} down" ${i===2?'disabled':''}>↓</button></span></div>`;}).join('')}</div></div>`;if(announce)document.querySelector('#feedback').textContent='Give the story a beginning, a problem and a change.';document.querySelector('#actions').innerHTML='<button class="orange wide" id="checkOrder">Try my story ✓</button>';
main.querySelectorAll('[data-order]').forEach(b=>{let tapStart=null;const choose=()=>{let i=Number(b.dataset.order);if(selected<0){selected=i;renderOrder(false);document.querySelector('#feedback').textContent='Scene selected. Tap another scene to swap places.';}else{[activity.order[selected],activity.order[i]]=[activity.order[i],activity.order[selected]];selected=-1;renderOrder(false);feedback('Scenes swapped. Does the story connect?');}};b.onpointerdown=e=>{if(e.pointerType==='touch')tapStart={x:e.clientX,y:e.clientY};};b.onpointercancel=()=>tapStart=null;b.onpointerup=e=>{if(e.pointerType==='touch'&&tapStart&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)<9){e.preventDefault();lastTouchChoice=performance.now();choose();}tapStart=null;};b.onclick=e=>{if(e.detail!==0&&performance.now()-lastTouchChoice<500)return;choose();};});
main.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [i,d]=b.dataset.move.split(',').map(Number);const order=activity.order;[order[i],order[i+d]]=[order[i+d],order[i]];selected=-1;renderOrder(false);feedback('Scene moved. Try the story when you are ready.');main.querySelector(`[data-order="${i+d}"]`).focus({preventScroll:true});});
const list=main.querySelector('.ordercards');list.addEventListener('pointerdown',e=>{let handle=e.target.closest('[data-grab]');if(!handle||e.button>0)return;e.preventDefault();const index=Number(handle.dataset.grab),item=handle.closest('.orderitem'),rect=item.getBoundingClientRect(),ghost=item.cloneNode(true);ghost.className='drag-ghost';ghost.removeAttribute('data-item');ghost.querySelectorAll('button').forEach(b=>b.tabIndex=-1);ghost.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;document.body.append(ghost);drag={pointer:e.pointerId,from:index,to:index,ghost,startY:e.clientY,offset:e.clientY-rect.top,valid:true,moved:false,list,items:[...list.children],rects:[...list.children].map(x=>x.getBoundingClientRect())};item.classList.add('drag-source');list.setPointerCapture(e.pointerId);document.body.style.userSelect='none';sfx('tap');});
list.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;e.preventDefault();const d=drag;d.moved=d.moved||Math.abs(e.clientY-d.startY)>5;d.ghost.style.top=(e.clientY-d.offset)+'px';const bounds=list.getBoundingClientRect();d.valid=e.clientX>=bounds.left-24&&e.clientX<=bounds.right+24&&e.clientY>=bounds.top-24&&e.clientY<=bounds.bottom+24;if(!d.valid){d.items.forEach(x=>{x.style.transform='';x.classList.remove('drop-before','drop-after');});return;}
let closest=0,distance=Infinity;d.rects.forEach((r,i)=>{let dist=Math.abs(e.clientY-(r.top+r.height/2));if(dist<distance){distance=dist;closest=i;}});d.to=closest;const step=d.rects[0].height+10;d.items.forEach((item,i)=>{item.classList.remove('drop-before','drop-after');let y=i===d.from?0:d.from<d.to&&i>d.from&&i<=d.to?-step:d.from>d.to&&i>=d.to&&i<d.from?step:0;item.style.transform=`translateY(${y}px)`;});if(d.to!==d.from)d.items[d.to].classList.add(d.to>d.from?'drop-after':'drop-before');
if(e.clientY>innerHeight-95&&document.documentElement.scrollHeight>innerHeight)window.scrollBy(0,6);else if(e.clientY<75&&scrollY>0)window.scrollBy(0,-6);
});
function end(e,cancel=false){if(!drag||e.pointerId!==drag.pointer)return;const d=drag;const valid=!cancel&&d.valid&&d.moved;if(list.hasPointerCapture(e.pointerId))list.releasePointerCapture(e.pointerId);stopDrag();if(valid&&d.from!==d.to){const moved=activity.order.splice(d.from,1)[0];activity.order.splice(d.to,0,moved);selected=-1;renderOrder(false);feedback('Scene dropped. Does your story flow now?');}else if(cancel||!d.valid)feedback('Move cancelled. Your scenes stayed in place.');}
list.addEventListener('pointerup',e=>end(e));list.addEventListener('pointercancel',e=>end(e,true));list.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.pointer)end(e,true);});
document.querySelector('#checkOrder').onclick=()=>{if(activity.order.some((x,i)=>x!==i)){feedback('The scenes feel out of order. Which moment starts the problem? Swap or drag and try again.',true);return;}feedback('The story connects. A beginning, a problem and a change.');main.querySelectorAll('.ordercards button').forEach(b=>b.disabled=true);document.querySelector('#actions').innerHTML=`<button class="orange wide" id="nextRound">${activity.round===2?'Finish story collection':'Next story →'}</button>`;document.querySelector('#nextRound').onclick=()=>{if(++activity.round===3)finishGame('order');else orderRound();};};}
const stories={moon:{title:'The Moon Garden',kind:'space',art:['🤖 🌱','🤖 🦊','🪴 💧','🤖 🛠️','🌱 ✨'],scenes:[{t:'Milo the robot wants to grow a moon garden. A seedling droops. Mira arrives with one small bottle of water.',next:'Meet Mira →'},{t:'Mira says, “I brought this for my own plant.” Milo wants the water. What happens next?',choices:['Ask if they can plan together','Grab the bottle without asking']},{t:['Milo asks. Mira offers half, and they plan how to reuse water. Both plants get a small drink.','Milo grabs it. Mira steps back, upset. Milo notices the silence and returns the bottle. Trust needs repair.'],next:'See what happens →'},{t:'There is still too little water for tomorrow. How could they move forward?',choices:['Build and test a water collector together','Use the last drops now and wait']},{t:['Their first collector leaks. They patch it together and save a few drops. The garden has a next step.','The water runs out. They decide to test a collector next. Waiting showed them why a plan matters.'],next:'Finish story ✓'}]},stage:{title:'The Tiny Big Talk',kind:'garden',art:['🦊 🎤','🦊 💭','🦊 🌬️','🦊 🐰','🎤 ✨'],scenes:[{t:'Mira has an idea for a quiet story corner. Today is the first chance to tell the club.',next:'Step toward the stage →'},{t:'Mira feels a flutter in the stomach. The first words get tangled. What should Mira try?',choices:['Take a comfortable breath and say one thought','Rush through every word at once']},{t:['Mira breathes and says, “I have an idea.” A short pause gives the audience time to listen.','Mira rushes. Dev misses the idea and asks for it again. Mira can slow down and restart.'],next:'Keep going →'},{t:'Dev asks, “Why do we need a story corner?” Mira does not know what everyone thinks yet.',choices:['Share one reason, then invite another idea','Pretend everyone already agrees']},{t:['Mira explains, then listens. Dev suggests cushions. The idea grows because more voices join in.','Dev looks puzzled. Mira says, “I should ask, not assume.” The group gets a new chance to join in.'],next:'Finish story ✓'}]}};
function startStory(id){cleanup();activity={id,scene:0,choices:[]};shell(stories[id].title,'Scene 1 of 5');renderStory();}
function renderStory(){const s=stories[activity.id],n=activity.scene,scene=s.scenes[n];document.querySelector('#roundLabel').textContent=`Scene ${n+1} of 5 · Your choices change the story`;const art=s.art[n].split(' ');document.querySelector('#playArea').innerHTML=`<div class="stage story-stage ${s.kind==='space'?'space':''}"><div class="scene-number">${n===2||n===4?'Your choice, its consequence':'An animated mini-story'}</div><div class="story-scene">${sceneArt(activity.id,n,activity.choices[n===2?0:1]||0)}</div></div><div class="story-caption" id="storyCaption"></div>`;document.querySelector('#storyCaption').textContent=Array.isArray(scene.t)?scene.t[activity.choices[n===2?0:1]]:scene.t;document.querySelector('#feedback').hidden=true;document.querySelector('#actions').innerHTML=scene.choices?scene.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c}</button>`).join(''):`<button class="primary wide" id="storyNext">${scene.next}</button>`;main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{activity.choices.push(Number(b.dataset.choice));activity.scene++;sfx('step');renderStory();});let next=document.querySelector('#storyNext');if(next)next.onclick=()=>{if(++activity.scene===5)finishStory();else{sfx('step');renderStory();}};window.scrollTo(0,0);}
function finishStory(){const id=activity.id;data.stories[id]=(Number(data.stories[id])||0)+1;persist();sfx('win');document.querySelector('#roundLabel').textContent='An ending to think about';document.querySelector('#playArea').innerHTML=`<div class="win"><div class="big">${sceneArt(id,4,0)}</div><h2>${id==='moon'?'Small kindness. Another try.':'Your voice has room.'}</h2><p>${id==='moon'?'Who changed their mind? Tell the story in your own words.':'Say one thought aloud, then pause. What do you notice?'}</p><p class="note">No microphone is used. You can practise quietly too.</p></div>`;document.querySelector('#actions').innerHTML='<div class="row"><button id="storyReplay" class="orange">Try other choices ↻</button><button id="storyDone">More stories</button></div>';document.querySelector('#storyReplay').onclick=()=>startStory(id);document.querySelector('#storyDone').onclick=()=>navigate('stories');}
document.documentElement.dataset.version='2.0-illustrated-drag';navigate('home');updateSound();document.querySelector('#soundDialog').showModal();
</script></body></html>
